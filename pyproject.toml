[project]
name = "esri-slpk-redaction"
version = "0.1.0"
description = "Blur regions of an Esri SLPK 3D mesh that fall inside a geographic polygon."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Benjamin Henriksson", email = "abenjaminhenriksson@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.3",
    "pillow>=12.1.1",
    "pyproj>=3.7.2",
    "rtree>=1.4.1",
    "scipy>=1.17.1",
    "shapely>=2.1.2",
]

[project.urls]
Repository = "https://github.com/BenjaminHenriksson/esri-slpk-redaction"
